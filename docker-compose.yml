name: monero-pool

services:
  backend:
    build:
      context: .
    ports:
      - 8888:8000
      - 8881:8001
      - 3333:3333
      - 5555:5555
      - 7777:7777
    volumes:
    - ./config.json:/opt/config.json
    - ./data/lmdb:/opt/lmdb
    - ./lib:/src/pool/lib
    - ./init.js:/src/pool/init.js
    depends_on:
    - database
  database:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: "development"
      MARIADB_USER: "ocean"
      MARIADB_PASSWORD: "development"
      MARIADB_DATABASE: "pool"
    volumes:
    - ./data/mariadb:/var/lib/mysql
    - ./deployment/base.sql:/docker-entrypoint-initdb.d/base.sql
    - ./deployment/config.sql:/docker-entrypoint-initdb.d/config.sql
